name: Verify + mint (public, reliable)
# Public CI = FREE unlimited minutes AND reliable scheduling. The private bull4life-engine repo silently SKIPS
# its scheduled runs (GitHub throttles private-repo schedules) + caps free minutes + queues behind the org pool —
# which repeatedly stalled minting. This moves the verify+mint brain here: it clones the private engine source
# READ+WRITE via ENGINE_TOKEN (source discarded with the runner, never committed/logged here), pulls the
# coordinator candles (fixes Binance-451), re-runs the DETERMINISTIC verify (strategy_plan --once --no-deliver),
# mints B4L, and pushes ONLY the chain + credits back to the private repo. Replaces bull4life-engine/verify-pool.yml
# (whose schedule gets disabled once this is confirmed live).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # every 3h — public schedules fire reliably; tighter than the old (skipped) 6h
concurrency:
  group: verify-mint
  cancel-in-progress: false
jobs:
  verify-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone private engine source (read+write token, never logged)
        run: |
          git clone "https://x-access-token:${ENGINE_TOKEN}@github.com/Bull4Life/bull4life-engine.git" engine 2>/dev/null
          cd engine && git config user.name "Bull4Life CI (public mint)" && git config user.email "dmanobela@gmail.com"
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: engine
        run: pip install -r requirements-node.txt ccxt
      - name: Cache coordinator candles (delta top-up after first run)
        uses: actions/cache@v4
        with:
          path: ~/b4l_candles
          key: b4l-candles-${{ github.run_id }}
          restore-keys: |
            b4l-candles-
      - name: Pull coordinator candles (avoid Binance-451 → the ~54 skipped targets mint)
        working-directory: engine
        env:
          B4L_COORDINATOR: https://compute.bull4life.com
        run: |
          mkdir -p "$HOME/b4l_candles"
          echo "B4L_CANDLE_DIR=$HOME/b4l_candles" >> "$GITHUB_ENV"
          B4L_CANDLE_DIR="$HOME/b4l_candles" python tools/ci_pull_candles.py || true
      - name: Verify the pool (re-run donated diamonds → merge winners → BANK CREDITS) — NO deliver (HOLD)
        working-directory: engine
        env:
          B4L_COORDINATOR: https://compute.bull4life.com
          B4L_DRAIN_TOKEN: ${{ secrets.B4L_DRAIN_TOKEN }}
          B4L_CANON_SIZING: '1'   # fresh-chain canonical sizing: re-verify the 158,884 re-inject with apply_canonical (Cludia 0549)
          B4L_ATTEST_TRUST: '1'   # #83 (Master 2026-08-10): trust our OWN attested nodes' verified diamonds -> skip the redundant re-run, bank credits fast; untrusted donors still full-verify + canary re-runs ~1/N
          # __B4L_CYCLE_BUDGET__: soft-stop the verify loop at 3900s so the mint+commit steps ALWAYS run inside
          # the 90-min job ceiling (else a full-cycle overrun times out the job => seeds upload but tokens don't mint).
          B4L_CYCLE_BUDGET_SEC: '3900'
        run: python strategy_plan.py --once --no-deliver || true
      - name: Mint B4L (append PoVC blocks — the token half)
        working-directory: engine
        run: |
          python b4l_chain/chain.py --mint || true
          echo "--- chain state after mint ---"
          python b4l_chain/chain.py --verify | tail -3 || true
      - name: Commit + push minted chain + credits back to the private engine
        working-directory: engine
        run: |
          for p in strategies compute/verified_credits.json compute/grid_results b4l_chain/b4l_chain.jsonl; do
            git add "$p" 2>/dev/null || true
          done
          echo "--- chain tip on disk ---"; tail -1 b4l_chain/b4l_chain.jsonl 2>/dev/null | head -c 200; echo
          echo "--- staged ---"; git diff --cached --stat
          if git diff --cached --quiet; then
            echo "no new verified winners / no new mint this run"
          else
            git commit -m "CI verify+mint (public): banked verified donor credits + minted B4L blocks [skip ci]"
            # Robust land (fixes the stall where a rejected push silently DROPPED a whole mint cycle): push ONLY on a
            # true fast-forward — never textually rebase minted blocks onto a moved tip (that would break the PoVC
            # hash-links = chain corruption). On real divergence, re-sync to the fresh tip and RE-MINT so the chain
            # still advances; --verify before every push so a bad chain can never be published.
            ok=0
            for i in 1 2 3 4 5; do
              git fetch -q origin master || { echo "[mint] fetch failed (attempt $i)"; sleep $((i*3)); continue; }
              if git merge-base --is-ancestor origin/master HEAD; then
                python b4l_chain/chain.py --verify >/dev/null 2>&1 || { echo "[mint] local chain FAILED verify — refusing to push"; exit 1; }
                if git push origin HEAD:master; then ok=1; break; fi
                echo "[mint] push raced (attempt $i) — refetch + retry"; sleep $((i*3))
              else
                echo "[mint] remote advanced mid-run — PRESERVING banked credits, re-syncing + re-minting on the fresh tip"
                cp -f compute/verified_credits.json /tmp/b4l_local_credits.json 2>/dev/null || true
                git reset --hard origin/master
                # verified_credits is MONOTONIC (per-node coresec only grows). git reset restored origin's OLDER credits
                # and would DROP the credits this run just banked (root cause of the h147 stall). Merge per-node MAX so
                # the freshly-banked credits survive, then --mint appends the delta onto the fresh chain tip.
                python -c "import json; L=json.load(open('/tmp/b4l_local_credits.json')); R=json.load(open('compute/verified_credits.json')); M={k:max(float(L.get(k,0)),float(R.get(k,0))) for k in set(L)|set(R)}; json.dump(M,open('compute/verified_credits.json','w'),indent=2); print('[mint] merged credits:',len(M),'nodes, total',round(sum(M.values()),1))" || true
                python b4l_chain/chain.py --mint || true
                for p in strategies compute/verified_credits.json compute/grid_results b4l_chain/b4l_chain.jsonl; do git add "$p" 2>/dev/null || true; done
                if git diff --cached --quiet; then echo "[mint] nothing new to mint after resync"; ok=2; break; fi
                git commit -m "CI verify+mint (public): re-minted on fresh tip after concurrent push [skip ci]"
              fi
            done
            [ "$ok" = 0 ] && { echo "[mint] could NOT land mint after 5 attempts (retries next cycle)"; exit 1; }
            echo "[mint] land done (status=$ok: 1=pushed, 2=noop-after-resync)"
          fi
