name: Publish signed chain state
# Standalone publisher — NO coupling to the mint pipeline (so it can never wedge minting). Clones the private engine
# READ-only, runs tools/emit_b4l_state.py (ed25519-signed with B4L_STATE_KEY), and publishes b4l_state.json to THIS
# public repo so Cludia's fund box raw-reads + verifies the on-chain state herself (independent genesis checks #2/#3).
# Raw URL: https://raw.githubusercontent.com/dmanobela-glitch/b4l-mint/main/b4l_state.json
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min — fresh signed snapshot + full chain + exchange_state (Cludia self-verify + MM oids)
  workflow_run:             # 2026-08-17: sync the mirror IMMEDIATELY after a drain (kills the lag that tripped the live peg verify twice)
    workflows: ["Drain pending tx (fast NAV lane)"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: publish-state
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo (publish target)
        uses: actions/checkout@v4
        with:
          path: pub
      - name: Clone private engine source (read-only token, never logged)
        run: git clone --depth 1 "https://x-access-token:${ENGINE_TOKEN}@github.com/Bull4Life/bull4life-engine.git" engine 2>/dev/null
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: engine
        run: pip install -r requirements-node.txt
      - name: Emit signed chain state
        working-directory: engine
        env:
          B4L_STATE_KEY: ${{ secrets.B4L_STATE_KEY }}
        run: |
          python tools/multichain/reserve_drift_check.py --json peg_status.json || echo "proof-of-reserve skipped (best-effort)"
          python tools/emit_b4l_state.py
          test -f compute/b4l_state.json || { echo "emit produced no b4l_state.json"; exit 1; }
          python -c "import json;d=json.load(open('compute/b4l_state.json'));print('signed=',d.get('signed'),'h',d.get('header',{}).get('height'),'genesis',(d.get('header',{}).get('genesis_hash') or '')[:16],'independent=',bool((d.get('reserve_proof') or {}).get('independent')))"
          python -c "import sys;sys.path.insert(0,'b4l_chain');import chain,json;json.dump(chain.exchange_state(),open('exchange_state.json','w'),indent=1);print('exchange_state open_orders',json.load(open('exchange_state.json')).get('open_orders'))"
      - name: Publish b4l_state.json to this public repo
        run: |
          cp engine/compute/b4l_state.json pub/b4l_state.json
          cp engine/b4l_chain/b4l_chain.jsonl pub/b4l_chain.jsonl
          cp engine/exchange_state.json pub/exchange_state.json
          cp engine/peg_status.json pub/peg_status.json 2>/dev/null || true
          cd pub
          git config user.name "Bull4Life CI (state publisher)"
          git config user.email "dmanobela@gmail.com"
          git add b4l_state.json b4l_chain.jsonl exchange_state.json peg_status.json
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to publish"
          else
            git commit -m "publish b4l_state.json + b4l_chain.jsonl + exchange_state.json + peg_status.json (public read surfaces) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null || true
              if git push; then echo "published (attempt $i)"; break; fi
              sleep 3
            done
          fi
